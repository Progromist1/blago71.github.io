<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Благотворительность</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 60px 20px 40px;
            position: relative;
            overflow: hidden;

            /* Фон — космос */
            background-image: url('https://unlimbot.hb.ru-msk.vkcloud-storage.ru/image/7/01a11c14-e323-73f1-9b6f-802f3c973ec7-3510cdfbd0ed47329b5660a971e38110.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Затемнение поверх фото — чтобы текст читался */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 20, 0.55);
            z-index: 0;
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        /* Главная надпись сверху */
        .main-title {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: 2px;
            text-align: center;
            background: linear-gradient(90deg, #ffb347, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }

        /* Блок с кнопкой — ниже середины, но не в самом низу */
        .button-zone {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 18vh;
        }

        .donate-btn {
            padding: 18px 48px;
            font-size: 20px;
            font-weight: 600;
            color: #0f0f14;
            background: linear-gradient(90deg, #ffb347, #ff6b6b);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.35);
        }

        /* Наведение — зелёная подсветка */
        .donate-btn:hover {
            transform: translateY(-4px);
            background: linear-gradient(90deg, #3ddc84, #1faa59);
            color: #ffffff;
            box-shadow: 0 0 18px rgba(61, 220, 132, 0.8),
                        0 0 40px rgba(61, 220, 132, 0.55),
                        0 12px 32px rgba(31, 170, 89, 0.45);
        }

        .donate-btn:active {
            transform: translateY(0);
            box-shadow: 0 0 12px rgba(61, 220, 132, 0.7);
        }

        max-width: 600px {
            .main-title { font-size: 38px; }
            .donate-btn { padding: 16px 32px; font-size: 17px; }
        }
    </style>
</head>
<body>

    <h1 class="main-title">Пожертвование</h1>
  <h2 class="main-title">Социальная подержка детей</h2>
    <div class="button-zone">
        <button class="donate-btn" onclick="goToDonate()">
            Ознакомиться с пожертвованием
        </button>
    </div>

    <script>
        function goToDonate() {
            window.location.href = 'donate.html';
        }
    </script>

</body>
</html>
