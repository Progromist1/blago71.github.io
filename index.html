<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пожертвование</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: #0f0f14;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 60px 20px 40px;
        }

        /* Главная надпись сверху */
        .main-title {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: 2px;
            text-align: center;
            background: linear-gradient(90deg, #ffb347, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Блок с кнопкой — ниже середины, но не в самом низу */
        .button-zone {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 18vh;
        }

        .donate-btn {
            padding: 18px 48px;
            font-size: 20px;
            font-weight: 600;
            color: #0f0f14;
            background: linear-gradient(90deg, #ffb347, #ff6b6b);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.35);
        }

        /* Наведение — зелёная подсветка */
        .donate-btn:hover {
            transform: translateY(-4px);
            background: linear-gradient(90deg, #3ddc84, #1faa59);
            color: #ffffff;
            box-shadow: 0 0 18px rgba(61, 220, 132, 0.8),
                        0 0 40px rgba(61, 220, 132, 0.55),
                        0 12px 32px rgba(31, 170, 89, 0.45);
        }

        .donate-btn:active {
            transform: translateY(0);
            box-shadow: 0 0 12px rgba(61, 220, 132, 0.7);
        }
    </style>
</head>
<body>

    <h1 class="main-title">Пожертвование</h1>

    <div class="button-zone">
        <button class="donate-btn" onclick="goToDonate()">
            Ознакомиться с пожертвованием
        </button>
    </div>

    <script>
        }
    </script>

</body>
</html>
